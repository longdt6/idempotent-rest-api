services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d transfers"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
