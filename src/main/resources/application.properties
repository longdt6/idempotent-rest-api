spring.application.name=idempotent-transfers
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/transfers}
spring.datasource.username=${DATABASE_USER:demo}
spring.datasource.password=${DATABASE_PASSWORD:demo}
spring.flyway.enabled=true
server.port=${PORT:8080}
# Reject fractional cents instead of silently truncating JSON numbers.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
# Flyway owns the schema; Hibernate verifies entity mappings at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# For the timeout/retry demo, set DEMO_PROCESSING_DELAY_MS=2000.
demo.processing-delay-ms=${DEMO_PROCESSING_DELAY_MS:0}
